# Deploy this folder as its own Netlify site (base directory: academy). No build step.
# Strict CSP for the app; the sandbox worker gets its own CSP that permits eval ONLY there and forbids all network.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.anthropic.com; worker-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/js/runner-worker.js"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'none'"
