<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bryan Agas — My Brain</title>
<meta name="description" content="Bryan Agas builds calm software for the parts of life that get messy. An interactive map of the brain behind it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#14110F; --surface:#1D1916; --surface-2:#27211D; --rule:#3A322C; --rule-strong:#5A4E44;
  --chalk:#F1EADF; --chalk-2:#BDB2A3; --chalk-3:#9A8F82; --lamp:#F2B35E;
  --h-projects:#F0A35E; --h-skills:#9DBCE0; --h-experience:#E68F72; --h-mindset:#9FCBA8;
  --h-current:#F4D58D; --h-experiments:#74C4BE; --h-ideas:#E7A2BC; --h-stem:#F2B35E;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-travel:cubic-bezier(.65,0,.35,1);
  --t-fast:160ms; --t-ui:240ms; --t-panel:400ms;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --panel-w:440px; --hue:var(--lamp);
}
*{box-sizing:border-box}
html{background:#14110F;color:#F1EADF;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:#14110F;color:#F1EADF;font-family:var(--sans);font-size:1rem;line-height:1.5;overflow:hidden;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html.is-plain body{overflow-y:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid #F2B35E;outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:calc(8px + var(--sat));z-index:100;background:#F2B35E;color:#14110F;padding:10px 14px;border-radius:999px;font:500 .8125rem/1 var(--mono);text-decoration:none;transform:translateY(-200%);transition:transform .2s}
.skip:focus{transform:none}
.skip-intro{position:fixed;right:calc(16px + var(--sar));bottom:calc(16px + var(--sab));z-index:60;font:500 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#BDB2A3;padding:12px 14px;border:1px solid #3A322C;border-radius:999px;background:#14110F}
.skip-intro:hover{color:#F1EADF}

/* ---------- header ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(24px + var(--sat)) calc(32px + var(--sar)) 0 calc(32px + var(--sal));pointer-events:none}
.top > *{pointer-events:auto}
.ident{max-width:30rem}
.name{margin:0;font:400 clamp(1.5rem,1.1rem + 1.2vw,1.875rem)/1.1 var(--serif);color:#F1EADF;letter-spacing:.005em}
.name a{text-decoration:none}
.pos{margin:6px 0 0;font:400 .9375rem/1.45 var(--sans);color:#BDB2A3;max-width:36ch}
.pos em{font-family:var(--serif);font-style:italic;font-size:1.0625rem;color:#F1EADF}
.status{margin:10px 0 0;font:500 .6875rem/1.2 var(--mono);letter-spacing:.08em;color:#9A8F82;display:flex;align-items:center;gap:8px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:#9FCBA8;box-shadow:0 0 0 3px rgba(159,203,168,.15)}
.sitenav{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tbtn{font:500 .8125rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#BDB2A3;text-decoration:none;padding:13px 12px;border-radius:999px;transition:color var(--t-fast)}
.tbtn:hover,.tbtn[aria-expanded="true"]{color:#F1EADF}
.cta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;background:#F2B35E;color:#14110F;font:600 .9375rem/1 var(--sans);text-decoration:none;margin-left:8px;transition:background var(--t-fast),transform var(--t-fast)}
.cta:hover{background:#F6C47D}
.cta:active{transform:scale(.98)}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden}
#gl,#c2d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage.can-hover #gl,.stage.can-hover #c2d{cursor:default}
.stage.over-brain #gl,.stage.over-brain #c2d{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%, rgba(20,17,15,0) 55%, rgba(12,10,9,.65) 100%)}
html[data-fallback] .stage{background:radial-gradient(55% 50% at 50% 48%, rgba(242,179,94,.07), rgba(20,17,15,0) 70%), #14110F}
.leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.leaders line{stroke:#5A4E44;stroke-width:1}
.leaders circle{fill:#BDB2A3}
.leaders g.on line{stroke:var(--c)}
.leaders g.on circle{fill:var(--c)}
.leaders g.dim{opacity:.55}
.cnav ul{list-style:none;margin:0;padding:0}
.cnav li{position:absolute;left:0;top:0;will-change:transform}
.clabel{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;font:500 .8125rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#BDB2A3;white-space:nowrap;position:relative;transition:color var(--t-fast),background var(--t-fast),opacity .6s}
.clabel .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.clabel .txt{position:relative}
.clabel .txt::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform 180ms var(--ease-out)}
.clabel .n{color:#9A8F82;font-weight:400}
.clabel:hover,.clabel.hot,.clabel:focus-visible{color:var(--c)}
.clabel:hover .txt::after,.clabel.hot .txt::after,.clabel:focus-visible .txt::after{transform:scaleX(1)}
.clabel[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
@supports not (background:color-mix(in srgb,red 10%,transparent)){.clabel[aria-pressed="true"]{background:rgba(242,179,94,.14)}}
.clabel[aria-pressed="true"] .n{color:var(--c)}
.stage.has-open .clabel:not([aria-pressed="true"]):not(:hover):not(:focus-visible):not(.hot){color:#9A8F82}
.clabel.out{color:#F2B35E;border:1px solid rgba(242,179,94,.35)}
.clabel.out .sub{color:#9A8F82;text-transform:none;letter-spacing:0;font-weight:400}
.preview{position:absolute;top:calc(100% + 6px);left:0;min-width:max-content;font:400 .875rem/1.35 var(--sans);letter-spacing:0;text-transform:none;color:#BDB2A3;background:rgba(20,17,15,.88);border:1px solid #3A322C;padding:8px 10px;border-radius:8px;opacity:0;transform:translateY(-4px);transition:opacity var(--t-fast),transform var(--t-fast);pointer-events:none}
.clabel:hover .preview,.clabel.hot .preview,.clabel:focus-visible .preview{opacity:1;transform:none}
.cnav li.r .preview{left:auto;right:0}
.cnav li.up .preview{top:auto;bottom:calc(100% + 6px)}
.intro .cnav li{opacity:.6}
.cnav li{transition:opacity .5s}

.nodebtns{position:fixed;inset:0;pointer-events:none}
.nodebtn{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:auto}
.nlabel,.ghost{position:fixed;left:0;top:0;pointer-events:none;font:500 .75rem/1.2 var(--mono);letter-spacing:.06em;color:#F1EADF;background:rgba(20,17,15,.86);border:1px solid #3A322C;border-radius:999px;padding:6px 10px;white-space:nowrap;opacity:0;transition:opacity 300ms;max-width:min(320px,70vw);overflow:hidden;text-overflow:ellipsis}
.nlabel.on,.ghost.on{opacity:1}
.ghost{color:#BDB2A3;font-style:normal;background:rgba(20,17,15,.6);border-style:dashed}
.chips{position:fixed;inset:0;pointer-events:none}
.chip{position:absolute;left:0;top:0;pointer-events:auto;font:400 .75rem/1 var(--mono);color:#BDB2A3;background:#27211D;border:1px solid #3A322C;border-radius:999px;padding:6px 10px;white-space:nowrap;transition:color var(--t-fast),border-color var(--t-fast),opacity .3s}
.chip:hover{color:#F1EADF;border-color:var(--c)}

.hint{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);text-align:center;font:500 .8125rem/1.5 var(--mono);color:#BDB2A3;width:max-content;max-width:calc(100vw - 32px);transition:opacity .4s}
.hint p{margin:0}
.hint .l1{display:inline-flex;align-items:center;gap:10px}
.hint .pulse{width:6px;height:6px;border-radius:50%;background:#F2B35E;box-shadow:0 0 0 0 rgba(242,179,94,.6)}
.hint .pulse.beat{animation:beat .65s ease-out}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(242,179,94,.65);transform:scale(1.4)}100%{box-shadow:0 0 0 10px rgba(242,179,94,0);transform:scale(1)}}
.hint .l2{margin-top:6px;display:flex;gap:6px 18px;justify-content:center;flex-wrap:wrap}
.hint a,.lnk{white-space:nowrap;color:#F1EADF;text-decoration:none;border-bottom:1px solid #5A4E44;padding:6px 0 2px;transition:border-color var(--t-fast),color var(--t-fast)}
.hint a:hover,.lnk:hover{border-color:#F2B35E;color:#F2B35E}
.hint.gone{opacity:0;pointer-events:none}

/* ---------- panel ---------- */
.panel{position:fixed;right:calc(16px + var(--sar));top:calc(92px + var(--sat));bottom:calc(16px + var(--sab));width:var(--panel-w);z-index:20;background:#1D1916;border:1px solid #3A322C;border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateX(24px);visibility:hidden;transition:opacity var(--t-panel) var(--ease-out),transform var(--t-panel) var(--ease-out),visibility 0s linear var(--t-panel)}
.panel.open{opacity:1;transform:none;visibility:visible;transition:opacity var(--t-panel) var(--ease-out),transform var(--t-panel) var(--ease-out),visibility 0s}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hue);z-index:2;transition:background .4s}
.panel-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3A322C transparent}
.panel-inner{padding:28px 28px 32px;transition:opacity 200ms}
.panel-inner.travel{opacity:.4}
.panel-inner.enter{animation:penter var(--t-ui) var(--ease-out)}
@keyframes penter{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.handle{display:none}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-6px 0 18px;min-height:32px}
.crumbs{font:500 .75rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#9A8F82;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:0;padding:0;list-style:none}
.crumbs button{color:#BDB2A3;padding:6px 0;border-radius:4px}
.crumbs button:hover{color:#F1EADF}
.crumbs .sep{color:#5A4E44}
.crumbs [aria-current]{color:#F1EADF;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{font:500 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#BDB2A3;display:inline-flex;align-items:center;gap:8px;padding:9px 4px 9px 10px;border-radius:999px;flex:none}
.close:hover{color:#F1EADF}
.kbd{font:500 .625rem/1 var(--mono);color:#9A8F82;border:1px solid #3A322C;border-radius:4px;padding:3px 5px}
.eyebrow{font:500 .75rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hue);margin:0 0 10px}
.ph{font:400 clamp(1.875rem,1.5rem + 1vw,2.25rem)/1.08 var(--serif);color:#F1EADF;margin:0;letter-spacing:.003em;text-wrap:balance}
.ph:focus{outline:none}
.ph:focus-visible{outline:none}
.line{font:400 1.0625rem/1.55 var(--sans);color:#BDB2A3;margin:10px 0 0}
.dek{font:400 italic 1.25rem/1.35 var(--serif);color:#E9DFD1;margin:12px 0 0;text-wrap:pretty}
.body p{font:400 1.0625rem/1.65 var(--sans);color:#F1EADF;margin:18px 0 0;max-width:60ch;text-wrap:pretty}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 0;padding:0;list-style:none}
.facts li{font:500 .75rem/1 var(--mono);letter-spacing:.02em;color:#BDB2A3;border:1px solid #3A322C;border-radius:999px;padding:7px 10px}
.links{margin:18px 0 0;display:flex;flex-wrap:wrap;gap:8px 18px}
.links a{font:500 .9375rem/1 var(--sans);color:var(--hue);text-decoration:none;border-bottom:1px solid currentColor;padding:8px 0 3px}
.links a:hover{color:#F1EADF}
.confirm{display:inline-block;font:500 .625rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9A8F82;border:1px dashed #5A4E44;border-radius:4px;padding:4px 6px;vertical-align:middle;white-space:nowrap}
.kickrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.kickrow .eyebrow{margin:0}
.sec{font:500 .6875rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9A8F82;margin:32px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:#3A322C}
.rows{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid #3A322C}
.rows li{border-bottom:1px solid #3A322C}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;width:100%;padding:14px 10px;margin:0 -10px;width:calc(100% + 20px);border-radius:8px;transition:background var(--t-fast)}
.row:hover,.row.hot{background:#27211D}
.row .t{font:600 1.0625rem/1.3 var(--sans);color:#F1EADF}
.row .s{grid-column:1;font:400 .9375rem/1.45 var(--sans);color:#BDB2A3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .c{grid-column:2;grid-row:1/span 2;align-self:center;font:500 .75rem/1 var(--mono);color:#9A8F82;white-space:nowrap}
.row:hover .c,.row.hot .c{color:var(--hue)}
.row .confirm{margin-left:8px;position:relative;top:-2px}
.conns{list-style:none;margin:0;padding:0}
.conn{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;align-items:start;width:calc(100% + 20px);margin:0 -10px;padding:12px 10px;border-radius:8px;transition:background var(--t-fast)}
.conn:hover{background:#27211D}
.conn .d{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:6px;box-shadow:0 0 8px var(--c)}
.conn .lab{font:400 .9375rem/1.4 var(--sans);color:#BDB2A3}
.conn .to{grid-column:2;font:600 1rem/1.35 var(--sans);color:#F1EADF}
.conn .to small{font:500 .6875rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-left:6px;white-space:nowrap}
.conn .ar{grid-column:3;grid-row:1/span 2;align-self:center;font:500 .875rem/1 var(--mono);color:#9A8F82;transition:transform var(--t-fast),color var(--t-fast)}
.conn:hover .ar{transform:translateX(3px);color:var(--c)}
.came{display:inline-flex;align-items:center;gap:8px;font:500 .75rem/1.3 var(--mono);letter-spacing:.04em;color:#BDB2A3;border:1px solid #3A322C;border-radius:999px;padding:8px 12px;margin:0 0 18px;max-width:100%;text-align:left}
.came:hover{color:#F1EADF;border-color:#5A4E44}
.came span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.regchips{display:flex;flex-wrap:wrap;gap:8px}
.regchip{display:inline-flex;align-items:center;gap:8px;font:500 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#BDB2A3;background:#27211D;border:1px solid #3A322C;border-radius:999px;padding:10px 12px}
.regchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.regchip:hover{color:var(--c);border-color:var(--c)}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid #3A322C;font:400 .9375rem/1.5 var(--sans);color:#BDB2A3}
.trailbar{position:sticky;top:0;z-index:3;background:#1D1916;margin:-28px -28px 20px;padding:20px 28px 16px;border-bottom:1px solid #3A322C}
.trailbar .tt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 .6875rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#F2B35E}
.trailbar .tt b{font-weight:500;color:#F1EADF;letter-spacing:.04em;text-transform:none;font-family:var(--sans);font-size:.9375rem}
.trailbar .tt span:last-child{color:#BDB2A3;white-space:nowrap}
.prog{display:flex;gap:4px;margin:12px 0 14px}
.prog i{flex:1;height:3px;border-radius:2px;background:#3A322C}
.prog i.on{background:#F2B35E}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #3A322C;font:500 .8125rem/1 var(--mono);letter-spacing:.04em;color:#F1EADF;background:#27211D;transition:border-color var(--t-fast),background var(--t-fast)}
.pill:hover{border-color:#5A4E44}
.pill.pri{background:#F2B35E;color:#14110F;border-color:#F2B35E;font-weight:500}
.pill.pri:hover{background:#F6C47D}
.pill[disabled]{opacity:.4;cursor:default}
.pill.ghostp{background:none}
.note{font:400 italic 1.25rem/1.38 var(--serif);color:#F1EADF;margin:0 0 22px;padding-left:14px;border-left:2px solid #F2B35E;text-wrap:pretty}
.endt{margin-top:30px;padding:20px;border:1px solid #3A322C;border-radius:12px;background:#27211D}
.endt h3{margin:0 0 6px;font:400 1.5rem/1.15 var(--serif);color:#F1EADF}
.endt p{margin:0 0 14px;color:#BDB2A3;font-size:.9375rem}
.endt .tlist{display:grid;gap:8px}
.hello-links{display:grid;gap:10px;margin:26px 0 0}
.biglink{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border:1px solid #3A322C;border-radius:12px;background:#27211D;text-decoration:none;transition:border-color var(--t-fast),transform var(--t-fast)}
.biglink:hover{border-color:#F2B35E;transform:translateY(-1px)}
.biglink b{display:block;font:400 1.75rem/1.1 var(--serif);color:#F1EADF}
.biglink small{display:block;margin-top:4px;font:500 .75rem/1.2 var(--mono);letter-spacing:.04em;color:#9A8F82}
.biglink span.ar{font:500 1.25rem/1 var(--mono);color:#F2B35E}
.overline{font:400 .9375rem/1.55 var(--sans);color:#BDB2A3;margin:16px 0 0}
.peek{display:none}

/* trails picker */
.trails{position:fixed;z-index:50;top:calc(76px + var(--sat));right:calc(170px + var(--sar));width:380px;max-width:calc(100vw - 32px);background:#1D1916;border:1px solid #3A322C;border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);padding:22px}
.trails[hidden]{display:none}
.trails h2{margin:0;font:400 1.75rem/1.1 var(--serif)}
.trails .sub{margin:6px 0 16px;color:#BDB2A3;font-size:.9375rem;line-height:1.5}
.tcard{display:block;width:100%;text-align:left;padding:14px;border:1px solid #3A322C;border-radius:10px;background:#27211D;margin-top:8px;transition:border-color var(--t-fast)}
.tcard:hover{border-color:#F2B35E}
.tcard b{display:block;font:600 1rem/1.3 var(--sans);color:#F1EADF}
.tcard span{display:block;font-size:.9375rem;color:#BDB2A3;margin-top:3px;line-height:1.45}
.tcard small{display:block;margin-top:10px;font:500 .6875rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#F2B35E}
.trails .x{position:absolute;top:14px;right:14px}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(10,8,7,.55)}
.scrim[hidden]{display:none}

/* plain view */
.plain{display:none}
html.is-plain .plain{display:block}
html.is-plain .top{background:#14110F;border-bottom:1px solid #3A322C;padding-bottom:16px}
html.is-plain .status{display:none}
.plain section.pc,.plain article{scroll-margin-top:170px!important}
html.is-plain .stage,html.is-plain .panel{display:none}

  L.btn.addEventListener('mouseleave', function(){ setHoverRegion(-1); });
  L.btn.addEventListener('focus', function(){ setHoverRegion(L.ri); L.btn.classList.add('hot'); });
  L.btn.addEventListener('blur', function(){ setHoverRegion(-1); L.btn.classList.remove('hot'); });
});
function setHoverRegion(ri){ if (state.hoverRegion === ri) return; state.hoverRegion = ri; computeTargets();
  labels.forEach(function(L){ L.btn.classList.toggle('hot', L.ri === ri && ri >= 0 && L.ri !== state.openRegion || (document.activeElement === L.btn)); }); }
// pointer on canvas
var canvasEls = [$('#gl'), $('#c2d')], downP = null;
function regionAt(px, py){ var b = unproject(px, py); if (!b) return -1; pointerBrain = b; return classify(b[0], b[1], false); }
canvasEls.forEach(function(cv){
  cv.addEventListener('pointermove', function(e){
    lastInput = now();
    if (e.pointerType === 'mouse'){
      var r = regionAt(e.clientX, e.clientY); stage.classList.toggle('over-brain', r >= 0); setHoverRegion(r >= 0 ? r : -1);
      sway.tyaw = ((e.clientX / W) - 0.5) * 2 * 6 * Math.PI / 180; sway.tpitch = ((e.clientY / H) - 0.5) * 2 * 3 * Math.PI / 180;
    }
  });
  cv.addEventListener('pointerleave', function(){ setHoverRegion(-1); pointerBrain = null; stage.classList.remove('over-brain'); sway.tyaw = 0; sway.tpitch = 0; });
  cv.addEventListener('pointerdown', function(e){ lastInput = now(); endIntro(); downP = {x:e.clientX, y:e.clientY, t:now()}; });
  cv.addEventListener('pointerup', function(e){
    if (!downP) return; var dx = e.clientX - downP.x, dy = e.clientY - downP.y, dt = now() - downP.t; downP = null;
    if (Math.abs(dx) >= 48 && dt < 400 && Math.abs(dx) > 1.5 * Math.abs(dy) && isPhone()){ swipe(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) return;
    // node discs (touch: 22px radius)
    if (state.openRegion >= 0 && state.openRegion !== STEM){
      var best = null, bd = 22;
      BRAIN.comp[REG[state.openRegion]].nodes.forEach(function(n){ var p = NPOS[n.key]; project(p[0], p[1], p[2], tmp3); var d = Math.hypot(tmp3[0] - e.clientX, tmp3[1] - e.clientY); if (d < bd){ bd = d; best = n; } });
      if (best){ go(keyToHash(best.key)); return; }
    }
    var r = regionAt(e.clientX, e.clientY);
    if (r === STEM){ go('hello'); }
    else if (r >= 0){ var id = REG[r]; if (!(state.route.type === 'comp' && state.route.comp === id)) go(id); }

  });
});
function swipe(d){
  var cur = state.openRegion >= 0 && state.openRegion !== STEM ? REG[state.openRegion] : null;
  var i = cur ? RING.indexOf(cur) : (d > 0 ? -1 : 0);
  go(RING[(i + d + RING.length) % RING.length]);
}
$('#homeLink').addEventListener('click', function(e){ e.preventDefault(); go(''); });

/* =====================================================================
   18. INTRO — "First breath"
   ===================================================================== */
var introT0 = 0, introOn = false, introTimers = [];
function startIntro(){
  introOn = true; introT0 = now(); waveV = 0; stage.classList.add('intro');
  var sk = $('#skipIntro'); sk.hidden = false; sk.onclick = function(){ endIntro(); };
  // labels wake front → back
  ['mindset','ideas','current','experiments','projects','experience','skills','stem'].forEach(function(id, i){
    introTimers.push(setTimeout(function(){ var L = labels.filter(function(x){ return x.id === id; })[0]; L.li.style.opacity = '1'; }, 150 + i * 120));
  });
  var pairs = [['mindset','ideas'],['ideas','current'],['current','experiments'],['experiments','projects'],['projects','skills'],['skills','experience']];
  var counts = [0, 1, 2, 4, 5, 6];
  pairs.forEach(function(pr, i){ introTimers.push(setTimeout(function(){
    var p = TRUNK_PATHS.filter(function(q){ return (q.a === pr[0] && q.b === pr[1]) || (q.a === pr[1] && q.b === pr[0]); })[0];
    if (p){ var rev = p.a !== pr[0], e = pathEnds(p, rev); fireOnPoly(4 + i, p, rev, 520, e[0], e[1], {ease:easeSine}); if (i === 0 || i === 3) lastAccent = now(); }
  }, 1300 + counts[i] * 200)); });
  introTimers.push(setTimeout(function(){ fireStem(CENT[1], null, 700); }, 1300 + 7 * 200));
  introTimers.push(setTimeout(endIntro, 2700));
}
function endIntro(){
  if (state.introDone) return;
  state.introDone = true; introOn = false; waveV = 1;
  introTimers.forEach(clearTimeout); introTimers = [];
  stage.classList.remove('intro'); labels.forEach(function(L){ L.li.style.opacity = ''; });
  var sk = $('#skipIntro'); if (document.activeElement === sk) $('#homeLink').focus(); sk.hidden = true;
  ss('brainIntro', '1'); clockT0 = now(); lastCount = -1; requestRender();
}
['wheel', 'touchstart'].forEach(function(ev){ window.addEventListener(ev, function(){ lastInput = now(); if (!state.introDone) endIntro(); }, {passive:true}); });

/* =====================================================================
   19. LOOP
   ===================================================================== */
var rafId = 0, running = true, lastT = 0, frameTimes = [], adaptDone = 0, adaptT0 = 0, lastFrameDrawn = 0;
function lerpTo(cur, tgt, k){ return cur + (tgt - cur) * k; }
function frame(t){
  rafId = 0;
  if (!running) return;
  if (!RM) rafId = requestAnimationFrame(frame);
  var dt = lastT ? Math.min(100, t - lastT) : 16; lastT = t;
  // phone full sheet → 30fps
  if (!RM && isPhone() && sheet === 'full' && !followPending && t - lastFrameDrawn < 30) return;
  lastFrameDrawn = t;
  var moving = updateCam(t);
  if (!RM){
    // intro wave
    if (introOn){ waveV = clamp((t - introT0) / 1300, 0, 1); }
    // salsa clock
    if (state.introDone){ var c = Math.floor((t - clockT0) / BEAT) % 8 + 1; if (c !== lastCount){ lastCount = c; onCount(c, t); } }
    // sway + parallax
    var ts = t / 1000;
    sway.pyaw = lerpTo(sway.pyaw, canHover ? sway.tyaw : 0, 0.06); sway.ppitch = lerpTo(sway.ppitch, canHover ? sway.tpitch : 0, 0.06);
    sway.regionYaw = lerpTo(sway.regionYaw, sway.regionYawT, 0.05);
    var lim = 14 * Math.PI / 180;
    cam.yaw = clamp(7 * Math.PI / 180 * Math.sin(ts * 2 * Math.PI / 26) + sway.pyaw + sway.regionYaw, -lim, lim);
    cam.pitch = clamp(2 * Math.PI / 180 * Math.sin(ts * 2 * Math.PI / 19) + sway.ppitch, -lim, lim);
    cam.s = 1 + 0.004 * Math.sin(ts * 2 * Math.PI / 10);
  } else { cam.yaw = sway.regionYawT * 0.5; cam.pitch = 0; cam.s = 1; }
  // region + path lerps
  var k = RM ? 1 : 1 - Math.exp(-dt / 70);
  for (var i = 0; i < 8; i++){ var c0 = regionCur[i], g = regionTgt[i]; c0.tint = lerpTo(c0.tint, g.tint, k); c0.dim = lerpTo(c0.dim, g.dim, k); c0.lift = lerpTo(c0.lift, g.lift, RM ? 1 : 1 - Math.exp(-dt / 90)); }
  var kp = RM ? 1 : 1 - Math.exp(-dt / 90);
  for (var j = 0; j < PATHS.length; j++){ var p = PATHS[j]; if (Math.abs(p.alpha - p.alphaT) > 0.002 || Math.abs(p.lamp - p.lampT) > 0.002){ p.alpha = lerpTo(p.alpha, p.alphaT, kp); p.lamp = lerpTo(p.lamp, p.lampT, kp); pathsDirty = true; } }
  for (var key in nodeVis){ var v = nodeVis[key]; v.a = lerpTo(v.a, v.aT, k); v.ring = lerpTo(v.ring, v.ringT, k); }
  if (R) R.render(t);
  if (layoutChanged()){ layoutLabels(); layoutNodesAndChips(); }
  needsRender = false;
  // adaptive quality (once or twice)
  if (!RM && state.introDone && adaptDone < 2 && R && R.kind === 'gl'){
    if (!adaptT0) adaptT0 = t; frameTimes.push(dt);
    if (t - adaptT0 > 2000){ var mean = frameTimes.reduce(function(a, b){ return a + b; }, 0) / frameTimes.length; frameTimes = []; adaptT0 = t; adaptDone++;
      if (mean > 19 && qualityScale > 0.5){ qualityScale = Math.max(0.5, qualityScale - 0.125); R.resize(); } }
  }

}
var LSIG = new Float64Array(13), layoutDirty = true;
function sg(i, v){ if (LSIG[i] !== v){ LSIG[i] = v; return 1; } return 0; }
function layoutChanged(){
  var ch = layoutDirty; layoutDirty = false;
  ch = sg(0, cam.yaw) | sg(1, cam.pitch) | sg(2, cam.s) | sg(3, cam.fx) | sg(4, cam.fy) | sg(5, cam.fz) | sg(6, cam.ppu) | sg(7, cam.ox) | sg(8, cam.oy) | sg(9, W) | sg(10, H) | sg(11, isPhone() ? sheetPx() : 0) | ch;
  return !!ch;
}
function startLoop(){ running = true; lastT = 0; if (!rafId) rafId = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', function(){ if (document.hidden){ running = false; if (rafId){ cancelAnimationFrame(rafId); rafId = 0; } } else if (!docEl.classList.contains('is-plain')) { clockT0 = now(); startLoop(); } });
if (window.IntersectionObserver){ /* plain view hides the stage via display:none; loop is stopped in setPlain */ }

/* =====================================================================
   20. RESIZE + BOOT
   ===================================================================== */
var resizeTimer = 0;
function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  measureHeader();
  var probe = document.createElement('div'); probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);visibility:hidden'; document.body.appendChild(probe); _sab = probe.offsetHeight; probe.remove();
  if (R) R.resize();

  measureLabels(); updateObstacles(); applySheet(); buildChips();
  if (state.route.type !== 'plain'){ panel.classList.toggle('open', state.route.type !== 'overview' || isPhone()); if (isPhone() && state.route.type === 'overview' && !pinner.innerHTML) setPanel(overviewPeekHTML(), LAMP, {noAnim:true}); if (!isPhone() && state.route.type === 'overview') pinner.innerHTML = ''; }

}
window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 120); });
mqRM.addEventListener && mqRM.addEventListener('change', function(){ location.reload(); });

function boot(){
  W = window.innerWidth; H = window.innerHeight;

  if (!hasDeep && !RM && !ss('brainIntro') && R) startIntro(); else endIntro();

  startLoop();
  window.__brain = {state:state, cam:cam, P:P, paths:PATHS, renderer:function(){ return R && R.kind; }, sigs:sigs};
}
boot();
})();
